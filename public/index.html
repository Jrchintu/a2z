<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>A2Z DSA Course Roadmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. CSS Variables (Theme) - Utilitarian Modern
           ========================================================================== */
        :root {
            /* Default to Light Theme */
            --primary-color: #3b82f6; /* Blue 500 */
            --primary-hover: #2563eb; /* Blue 600 */
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;

            --bg-body: #f8fafc; /* Slate 50 */
            --bg-surface: #ffffff; /* White */
            --bg-subtle: #f1f5f9; /* Slate 100 */
            --bg-sub-collapsible: #f1f5f9; /* Slate 100 */
            
            --border-color: #e2e8f0; /* Slate 200 */
            --border-hover: #cbd5e1; /* Slate 300 */

            --text-primary: #0f172a; /* Slate 900 */
            --text-secondary: #334155; /* Slate 700 */
            --text-muted: #64748b; /* Slate 500 */
            
            --link-color: #2563eb; /* Blue 600 */

            --completed-bg: rgba(34, 197, 94, 0.3);
            --completed-text: #15803d; /* Green 700 */

            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-hover: 0 0 25px -5px rgb(59 130 246 / 0.25);
        }

        /* Dark Theme Support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a; /* Slate 900 */
                --bg-surface: #1e293b; /* Slate 800 */
                --bg-subtle: #334155; /* Slate 700 */
                --bg-sub-collapsible: rgba(30, 41, 59, 0.5);
                
                --border-color: #334155;
                --border-hover: #475569;

                --text-primary: #f8fafc; /* Slate 50 */
                --text-secondary: #cbd5e1; /* Slate 300 */
                --text-muted: #94a3b8; /* Slate 400 */
                
                --link-color: #60a5fa; /* Blue 400 */

                --completed-bg: rgba(34, 197, 94, 0.5);
                --completed-text: #4ade80;
            }
        }

        /* ==========================================================================
           2. Base & Reset
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--bg-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==========================================================================
           3. Layout
           ========================================================================== */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: box-shadow 0.2s, border-color 0.2s;
            contain: layout style paint;
        }

        /* Enhanced hover for desktop only */
        @media (hover: hover) and (pointer: fine) {
            .container:hover {
                border-color: var(--primary-color);
                box-shadow: var(--shadow-hover);
            }
        }

        h1 {
            margin-top: 0;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: -0.025em;
        }

        /* ==========================================================================
           4. Collapsible Sections
           ========================================================================== */
        .collapsible,
        .sub-collapsible {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 1rem;
            padding: 1.25rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            color: var(--text-primary);
            background-color: var(--bg-surface);
            text-align: left;
            transition: border-color 0.15s ease-out, box-shadow 0.15s ease-out;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            gap: 1rem;
            contain: layout style paint;
        }

        .collapsible {
            font-size: 1.125rem;
            box-shadow: var(--shadow-sm);
        }

        .sub-collapsible {
            font-size: 1rem;
            margin-top: 0.75rem;
            background-color: var(--bg-sub-collapsible);
            border: 1px solid var(--border-color);
        }

        /* Progress Bar Overlay */
        .collapsible::before,
        .sub-collapsible::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            transform: scaleX(var(--progress-scale, 0));
            transform-origin: left;
            background-color: var(--completed-bg);
            transition: transform 0.3s ease-out;
        }

        .collapsible:hover,
        .sub-collapsible:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        .collapsible.active,
        .sub-collapsible.active {
            border-color: var(--primary-color);
            background-color: var(--bg-surface);
        }

        .collapsible-title {
            flex-grow: 1;
            margin-right: auto;
            line-height: 1.4;
        }

        .progress-counter {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background-color: var(--bg-body);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .collapsible::after,
        .sub-collapsible::after {
            content: '+';
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-muted);
            transition: transform 0.3s ease, color 0.2s;
            flex-shrink: 0;
            line-height: 1;
        }

        .collapsible.active::after,
        .sub-collapsible.active::after {
            transform: rotate(45deg);
            color: var(--primary-color);
        }

        .content,
        .sub-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.25s ease-out;
            contain: content;
        }
        
        .content > *,
        .sub-content > * {
            overflow: hidden;
        }
        
        .collapsible.active + .content,
        .sub-collapsible.active + .sub-content {
            grid-template-rows: 1fr;
        }

        .content {
            padding: 0 0.5rem;
        }

        /* ==========================================================================
           5. Tables
           ========================================================================== */
        .table-container {
            overflow-x: auto;
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }

        table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            font-size: 0.9375rem;
            contain: layout style;
            content-visibility: auto;
            contain-intrinsic-size: auto 500px;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--bg-subtle);
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .topic-cell {
            width: 40%;
            font-weight: 500;
            color: var(--text-primary);
            word-break: break-word;
            min-width: 200px;
        }

        /* ==========================================================================
           6. Status & Links
           ========================================================================== */
        tr.completed {
            background-color: var(--completed-bg);
        }
        
        tr.completed .topic-title {
            color: var(--completed-text);
            text-decoration: line-through; /* Optional: strike-through for completed */
        }

        /* Difficulty Indicators (Left Border) */
        .difficulty-easy td:first-child { box-shadow: inset 4px 0 0 0 var(--success-color); }
        .difficulty-medium td:first-child { box-shadow: inset 4px 0 0 0 var(--warning-color); }
        .difficulty-hard td:first-child { box-shadow: inset 4px 0 0 0 var(--danger-color); }

        .link-cell {
            text-align: center;
            padding: 0;
            min-width: 3.5rem; /* Ensure consistent width */
        }
        
        .link-cell a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-height: 3.5rem; /* Ensure clickable area covers the row height */
            color: var(--link-color);
            padding: 0.25rem;
            border-radius: 0;
        }
        
        .link-cell a:hover {
            background-color: var(--bg-subtle);
        }

        .link-cell svg, .link-cell img {
            width: 2.8rem;
            height: 2.8rem;
            display: block;
            object-fit: contain;
        }

        .na-cell {
            text-align: center;
            color: var(--text-muted);
        }

        .status-cell {
            text-align: center;
        }

        .status-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
            accent-color: var(--success-color);
        }

        /* ==========================================================================
           7. Responsive (Full Page Mobile)
           ========================================================================== */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .container {
                max-width: 100%;
                margin: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
                padding: 1rem;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
                border-bottom: 1px solid var(--border-color);
            }

            /* Keep collapsible items in one row, let title wrap */
            .collapsible, .sub-collapsible {
                padding: 1rem;
                gap: 0.75rem;
                align-items: center; /* Ensure vertical alignment */
            }
            
            .collapsible-title {
                font-size: 1rem;
                width: auto; /* Reset width */
                margin-bottom: 0; /* Reset margin */
            }
            
            .progress-counter {
                font-size: 0.7rem;
                padding: 0.2rem 0.5rem;
                margin-left: 0;
            }
            
            .collapsible::after, .sub-collapsible::after {
                margin-left: 0;
            }

            /* Full width table container */
            .table-container {
                margin-left: 0;
                margin-right: 0;
                border-left: 1px solid var(--border-color);
                border-right: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                width: 100%;
                -webkit-overflow-scrolling: touch;
            }
            
            th, td {
                padding: 0.75rem 0.5rem;
                font-size: 0.875rem;
            }
        }

        /* ==========================================================================
           8. Auth UI Styles
           ========================================================================== */
        .auth-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .auth-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: inherit;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            color: var(--text-primary);
            text-decoration: none;
        }

        .auth-btn:hover {
            background-color: var(--bg-subtle);
            border-color: var(--primary-color);
        }

        .auth-btn svg {
            width: 16px;
            height: 16px;
        }

        .auth-btn.logout-btn {
            display: none;
        }

        #user-info {
            display: none;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        #user-email {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .sync-indicator {
            display: none;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .sync-indicator.syncing {
            display: inline-flex;
        }

        .sync-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .auth-header {
                flex-wrap: wrap;
                justify-content: center;
            }

            #user-email {
                max-width: 150px;
            }
        }
    </style>
</head>

<body>
    <div id="roadmap-container" class="container">
        <div class="auth-header" id="auth-container">
            <span id="user-info">
                <span class="user-avatar" id="user-avatar">U</span>
                <span id="user-email"></span>
            </span>
            <span class="sync-indicator" id="sync-indicator">
                <span class="sync-spinner"></span>
                <span>Syncing...</span>
            </span>
            <a href="login.html" class="auth-btn" id="login-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                Sign In
            </a>
            <button class="auth-btn logout-btn" id="logout-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sign Out
            </button>
        </div>
        <div id="roadmap-content">
            <h1>Loading Roadmap...</h1>
        </div>
    </div>
    <script>
        const STORAGE_KEY = 'dsaRoadmapProgress';

        // Pre-built logo HTML strings for faster lookups
        const platformLogos = {
            BLOG: '<img src="./assets/logo/post.svg" alt="BLOG" loading="lazy">',
            YT: '<img src="./assets/logo/yt.svg" alt="YT" loading="lazy">',
            TUF: '<img src="./assets/logo/tuf.svg" alt="TUF" loading="lazy">',
            GFG: '<img src="./assets/logo/gfg.svg" alt="GFG" loading="lazy">',
            CN: '<img src="./assets/logo/cn.svg" alt="CN" loading="lazy">',
            LC: '<img src="./assets/logo/lc.svg" alt="LC" loading="lazy">',
            ALT: '<img src="./assets/logo/alt.svg" alt="ALT" loading="lazy">'
        };

        // Pre-computed difficulty classes
        const difficultyClasses = ['difficulty-easy', 'difficulty-medium', 'difficulty-hard'];

        // In-memory progress cache
        let progressCache = null;
        let saveTimeout = null;
        
        // Cached DOM elements
        let roadmapContainer = null;
        let syncIndicator = null;

        // Optimized localStorage operations with caching
        function loadCompletionState() {
            if (progressCache !== null) return progressCache;
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                progressCache = saved ? JSON.parse(saved) : {};
            } catch (e) {
                console.error("Failed to load progress from localStorage", e);
                progressCache = {};
            }
            return progressCache;
        }

        // Debounced save to reduce localStorage writes
        function saveCompletionState() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(progressCache));
                } catch (e) {
                    console.error("Failed to save progress to localStorage", e);
                }
            }, 100);
        }

        // Start auth initialization immediately (non-blocking)
        let authInitPromise = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            // Cache DOM elements early
            roadmapContainer = document.getElementById('roadmap-container');
            syncIndicator = document.getElementById('sync-indicator');
            
            // Start auth init early without blocking
            authInitPromise = Auth.init().catch(() => {});
            
            fetch('a2z.json', { cache: 'default' }).then(response => {
                if (!response.ok) throw new Error('Network response was not ok. Make sure a2z.json is in the same folder.');
                return response.json();
            }).then(roadmapData => {
                const progress = loadCompletionState();
                generateRoadmap(roadmapData, progress);
                addEventListeners();
                
                // Sync cloud progress in background
                authInitPromise?.then(syncCloudProgress);
            }).catch(handleError);
        }, { once: true });
        
        async function syncCloudProgress() {
            if (!Auth.currentUser) return;
            
            syncIndicator?.classList.add('syncing');
            
            try {
                const cloudProgress = await Auth.loadProgressFromCloud();
                
                if (cloudProgress) {
                    const localProgress = loadCompletionState();
                    const changedIds = [];
                    
                    for (const key in cloudProgress) {
                        if (cloudProgress[key] === true && !localProgress[key]) {
                            localProgress[key] = true;
                            changedIds.push(key);
                        }
                    }
                    
                    if (changedIds.length) {
                        progressCache = localProgress;
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(progressCache));
                        
                        // Batch DOM updates
                        requestAnimationFrame(() => {
                            const len = changedIds.length;
                            for (let i = 0; i < len; i++) {
                                const row = document.querySelector(`[data-topic-id="${changedIds[i]}"]`);
                                if (row) {
                                    row.classList.add('completed');
                                    const checkbox = row.querySelector('.status-checkbox');
                                    if (checkbox) checkbox.checked = true;
                                }
                            }
                            updateAllCounters();
                        });
                    }
                }
            } catch (e) {
                console.error('Cloud sync failed:', e);
            } finally {
                syncIndicator?.classList.remove('syncing');
            }
        }
        
        function updateAllCounters() {
            requestAnimationFrame(() => {
                const checkboxes = document.querySelectorAll('.status-checkbox');
                checkboxes.forEach(checkbox => {
                    if (checkbox.checked) {
                        updateCounters(checkbox, true);
                    }
                });
            });
        }

        // Optimized alternate link generation with early returns
        function generateAlternateLink(postLink) {
            if (!postLink) return null;
            try {
                const url = new URL(postLink);
                const path = url.pathname;
                const firstSlash = path.indexOf('/', 1);
                if (firstSlash === -1) return null;
                const secondSlash = path.indexOf('/', firstSlash + 1);
                const category = path.slice(1, firstSlash);
                const articleName = secondSlash === -1 ? path.slice(firstSlash + 1) : path.slice(firstSlash + 1, secondSlash);
                if (!category || !articleName) return null;
                return `articles/${category}/${articleName}.html`;
            } catch (e) {
                return null;
            }
        }

        // Inline link cell creation for better performance
        function createLinkCell(url, label) {
            return url
                ? `<td class="link-cell"><a href="${url}" target="_blank" rel="noopener noreferrer" title="${label}">${platformLogos[label] || label}</a></td>`
                : '<td class="na-cell">-</td>';
        }

        function generateRoadmap(data, progress) {
            const container = document.getElementById('roadmap-content');
            const frag = document.createDocumentFragment();
            const h1 = document.createElement('h1');
            h1.textContent = 'A2Z DSA Course Roadmap';
            frag.appendChild(h1);
            
            const dataLen = data.length;

            for (let i = 0; i < dataLen; i++) {
                const step = data[i];
                let totalStepTopics = 0;
                let completedStepTopics = 0;
                const contentDiv = document.createElement('div');
                contentDiv.className = 'content';
                const contentInner = document.createElement('div');

                if (step.sub_steps) {
                    const subSteps = step.sub_steps;
                    const subLen = subSteps.length;

                    for (let j = 0; j < subLen; j++) {
                        const subStep = subSteps[j];
                        const topics = subStep.topics;
                        const totalSubStepTopics = topics.length;
                        let completedSubStepTopics = 0;

                        for (let k = 0; k < totalSubStepTopics; k++) {
                            if (progress[topics[k].id]) completedSubStepTopics++;
                        }

                        const subStepPercentage = totalSubStepTopics > 0 ? completedSubStepTopics / totalSubStepTopics : 0;
                        totalStepTopics += totalSubStepTopics;
                        completedStepTopics += completedSubStepTopics;

                        // Build topic rows
                        const rowParts = [];
                        for (let k = 0; k < totalSubStepTopics; k++) {
                            const topic = topics[k];
                            const isCompleted = progress[topic.id];
                            const diffClass = difficultyClasses[topic.difficulty] || '';
                            const alternateLink = generateAlternateLink(topic.post_link);
                            
                            let tags = '';
                            if (topic.ques_topic) {
                                try {
                                    const parsed = JSON.parse(topic.ques_topic);
                                    const tagLabels = [];
                                    for (let t = 0; t < parsed.length; t++) tagLabels.push(parsed[t].label);
                                    tags = tagLabels.join(', ');
                                } catch (e) {}
                            }

                            rowParts.push(
                                '<tr class="', diffClass, isCompleted ? ' completed' : '', '" data-topic-id="', topic.id, '">',
                                '<td class="topic-cell" title="', tags, '"><div class="topic-title">', topic.question_title, '</div></td>',
                                createLinkCell(topic.lc_link, 'LC'),
                                createLinkCell(topic.gfg_link, 'GFG'),
                                createLinkCell(topic.cs_link, 'CN'),
                                createLinkCell(topic.plus_link, 'TUF'),
                                createLinkCell(topic.post_link, 'BLOG'),
                                createLinkCell(alternateLink, 'ALT'),
                                createLinkCell(topic.yt_link, 'YT'),
                                '<td class="status-cell"><input type="checkbox" class="status-checkbox" data-id="', topic.id, '"', isCompleted ? ' checked' : '', '></td></tr>'
                            );
                        }
                        
                        const isSubComplete = totalSubStepTopics > 0 && completedSubStepTopics === totalSubStepTopics;

                        contentInner.insertAdjacentHTML('beforeend',
                            '<button type="button" class="sub-collapsible' + (isSubComplete ? ' completed' : '') + '" style="--progress-scale:' + subStepPercentage + '" data-step="' + step.step_no + '" data-substep="' + subStep.sub_step_no + '">' +
                            '<span class="collapsible-title">' + subStep.sub_step_no + '. ' + subStep.sub_step_title.replace(/\n/g, ' ') + '</span>' +
                            '<span class="progress-counter">' + completedSubStepTopics + '/' + totalSubStepTopics + '</span></button>' +
                            '<div class="sub-content"><div><div class="table-container"><table><thead><tr>' +
                            '<th>Topic</th><th title="LeetCode">Leetcode</th><th title="GeeksForGeeks">GFG</th>' +
                            '<th title="CodingNinjas">CN</th><th title="TakeUForward+">TUF</th><th title="Blog">Blog</th>' +
                            '<th title="Alternate Article">Blog</th><th title="YouTube">YouTube</th><th>Done</th>' +
                            '</tr></thead><tbody>' + rowParts.join('') + '</tbody></table></div></div></div>'
                        );
                    }
                }

                const isStepComplete = totalStepTopics > 0 && completedStepTopics === totalStepTopics;
                const stepPercentage = totalStepTopics > 0 ? completedStepTopics / totalStepTopics : 0;

                const stepBtn = document.createElement('button');
                stepBtn.type = 'button';
                stepBtn.className = 'collapsible' + (isStepComplete ? ' completed' : '');
                stepBtn.style.setProperty('--progress-scale', stepPercentage);
                stepBtn.dataset.step = step.step_no;
                stepBtn.innerHTML = '<span class="collapsible-title">Step ' + step.step_no + ': ' + step.step_title + '</span><span class="progress-counter">' + completedStepTopics + '/' + totalStepTopics + '</span>';
                
                contentDiv.appendChild(contentInner);
                frag.appendChild(stepBtn);
                frag.appendChild(contentDiv);
            }

            container.replaceChildren(frag);
        }

        function updateCounters(checkbox, isChecked) {
            requestAnimationFrame(() => {
                const row = checkbox.parentElement.parentElement;
                const tbody = row.parentElement;
                const subContent = tbody.closest('.sub-content');
                const subStepButton = subContent.previousElementSibling;
                
                // Update sub-step counter
                const checkboxes = tbody.querySelectorAll('.status-checkbox');
                const totalSubStep = checkboxes.length;
                let completedSubStep = 0;
                for (let i = 0; i < totalSubStep; i++) {
                    if (progressCache[checkboxes[i].dataset.id]) completedSubStep++;
                }
                
                const subStepCounter = subStepButton.querySelector('.progress-counter');
                subStepCounter.textContent = completedSubStep + '/' + totalSubStep;
                const subStepPercentage = totalSubStep > 0 ? completedSubStep / totalSubStep : 0;
                subStepButton.style.setProperty('--progress-scale', subStepPercentage);
                subStepButton.classList.toggle('completed', totalSubStep > 0 && completedSubStep === totalSubStep);

                // Update main step counter
                const mainContent = subContent.closest('.content');
                const mainStepButton = mainContent.previousElementSibling;
                const allCheckboxes = mainContent.querySelectorAll('.status-checkbox');
                const totalStep = allCheckboxes.length;
                let completedStep = 0;
                for (let i = 0; i < totalStep; i++) {
                    if (progressCache[allCheckboxes[i].dataset.id]) completedStep++;
                }

                const mainStepCounter = mainStepButton.querySelector('.progress-counter');
                mainStepCounter.textContent = completedStep + '/' + totalStep;
                const stepPercentage = totalStep > 0 ? completedStep / totalStep : 0;
                mainStepButton.style.setProperty('--progress-scale', stepPercentage);
                mainStepButton.classList.toggle('completed', totalStep > 0 && completedStep === totalStep);
            });
        }

        function addEventListeners() {
            // Optimized click handler with event delegation
            roadmapContainer.addEventListener('click', function(e) {
                const target = e.target;
                
                // Handle collapsible toggle
                const collapsible = target.closest('.collapsible, .sub-collapsible');
                if (collapsible) {
                    e.preventDefault();
                    collapsible.classList.toggle('active');
                    return;
                }

                // Handle checkbox toggle
                const statusCell = target.closest('.status-cell');
                if (statusCell) {
                    const checkbox = statusCell.firstElementChild;
                    if (checkbox) {
                        if (target !== checkbox) checkbox.checked = !checkbox.checked;
                        const topicId = checkbox.dataset.id;
                        const isChecked = checkbox.checked;
                        progressCache[topicId] = isChecked;
                        saveCompletionState();
                        checkbox.parentElement.parentElement.classList.toggle('completed', isChecked);
                        updateCounters(checkbox, isChecked);
                    }
                }
            });
        }
        
        function handleError(error) {
            console.error('Error:', error);
            document.getElementById('roadmap-content').innerHTML = 
                '<h1>Error</h1><p>Could not load the roadmap. Please ensure \'a2z.json\' is in the same directory and correctly formatted.</p><p><em>' + error.message + '</em></p>';
        }
    </script>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-config.js" defer></script>
    <script>
        // Auth integration for roadmap page
        document.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.getElementById('logout-btn');
            const userAvatar = document.getElementById('user-avatar');

            // Handle logout
            logoutBtn?.addEventListener('click', async () => {
                await Auth.signOut();
            });

            // Override saveCompletionState to sync with cloud
            const originalSaveCompletionState = saveCompletionState;
            saveCompletionState = function() {
                originalSaveCompletionState();
                
                // Sync to cloud if logged in
                if (Auth.currentUser) {
                    syncIndicator?.classList.add('syncing');
                    Auth.saveProgressToCloud(progressCache).finally(() => {
                        setTimeout(() => syncIndicator?.classList.remove('syncing'), 500);
                    });
                }
            };

            // Update avatar with user initial when auth is ready
            authInitPromise?.then(() => {
                if (Auth.currentUser?.email && userAvatar) {
                    userAvatar.textContent = Auth.currentUser.email.charAt(0).toUpperCase();
                }
            });
        }, { once: true });
    </script>
