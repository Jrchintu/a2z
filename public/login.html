<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - A2Z DSA Course</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-subtle: #f1f5f9;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --link-color: #2563eb;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a;
                --bg-surface: #1e293b;
                --bg-subtle: #334155;
                --border-color: #334155;
                --text-primary: #f8fafc;
                --text-secondary: #cbd5e1;
                --text-muted: #94a3b8;
                --link-color: #60a5fa;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .auth-header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab-btn:hover {
            color: var(--text-secondary);
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: var(--bg-surface);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: inherit;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            background-color: var(--bg-subtle);
            border-color: var(--text-muted);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .divider span {
            padding: 0 1rem;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--link-color);
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .message {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        .message.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .message.success {
            display: block;
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            
            .auth-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <a href="index.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to DSA Sheet
        </a>

        <div class="auth-header">
            <h1>Welcome</h1>
            <p>Sign in to sync your progress across devices</p>
        </div>

        <div id="message" class="message"></div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="login">Sign In</button>
            <button class="tab-btn" data-tab="signup">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div id="login-tab" class="tab-content active">
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" required minlength="6">
                    <a href="#" class="forgot-password" id="forgot-password-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signup-tab" class="tab-content">
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="••••••••" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" name="confirm-password" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" id="signup-btn">
                    <span class="btn-text">Create Account</span>
                </button>
            </form>
        </div>

        <!-- Forgot Password Form (Hidden by default) -->
        <div id="forgot-tab" class="tab-content">
            <form id="forgot-form">
                <div class="form-group">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" name="email" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary" id="forgot-btn">
                    <span class="btn-text">Send Reset Link</span>
                </button>
                <button type="button" class="btn btn-outline" id="back-to-login" style="margin-top: 0.75rem;">
                    Back to Sign In
                </button>
            </form>
        </div>

        <div class="divider"><span>or continue with</span></div>

        <div class="social-buttons">
            <button type="button" class="btn btn-outline social-btn" id="google-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
            <button type="button" class="btn btn-outline social-btn" id="github-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                Continue with GitHub
            </button>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const messageEl = document.getElementById('message');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            const tabs = document.querySelector('.tabs');
            const divider = document.querySelector('.divider');
            const socialButtons = document.querySelector('.social-buttons');

            // Show message helper
            function showMessage(text, type = 'error') {
                messageEl.textContent = text;
                messageEl.className = `message ${type}`;
            }

            function clearMessage() {
                messageEl.className = 'message';
                messageEl.textContent = '';
            }

            function setLoading(btn, loading) {
                const textEl = btn.querySelector('.btn-text');
                if (loading) {
                    btn.disabled = true;
                    textEl.innerHTML = '<span class="spinner"></span>';
                } else {
                    btn.disabled = false;
                    textEl.textContent = btn.id === 'login-btn' ? 'Sign In' : 
                                         btn.id === 'signup-btn' ? 'Create Account' : 
                                         btn.id === 'forgot-btn' ? 'Send Reset Link' : '';
                }
            }

            // Tab switching
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.dataset.tab;
                    
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                        if (content.id === `${tabId}-tab`) {
                            content.classList.add('active');
                        }
                    });
                    
                    clearMessage();
                    
                    // Show/hide social buttons and divider for forgot password
                    if (tabId === 'forgot') {
                        tabs.style.display = 'none';
                        divider.style.display = 'none';
                        socialButtons.style.display = 'none';
                    } else {
                        tabs.style.display = 'flex';
                        divider.style.display = 'flex';
                        socialButtons.style.display = 'flex';
                    }
                });
            });

            // Forgot password link
            document.getElementById('forgot-password-link').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('forgot-tab').classList.add('active');
                document.getElementById('login-tab').classList.remove('active');
                tabs.style.display = 'none';
                divider.style.display = 'none';
                socialButtons.style.display = 'none';
                clearMessage();
            });

            // Back to login from forgot password
            document.getElementById('back-to-login').addEventListener('click', () => {
                document.getElementById('forgot-tab').classList.remove('active');
                document.getElementById('login-tab').classList.add('active');
                tabs.style.display = 'flex';
                divider.style.display = 'flex';
                socialButtons.style.display = 'flex';
                clearMessage();
            });

            // Login form
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessage();
                
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const btn = document.getElementById('login-btn');
                
                setLoading(btn, true);
                
                const result = await Auth.signInWithEmail(email, password);
                
                setLoading(btn, false);
                
                if (result.success) {
                    showMessage('Signed in successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showMessage(result.error);
                }
            });

            // Signup form
            document.getElementById('signup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessage();
                
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;
                const confirmPassword = document.getElementById('signup-confirm-password').value;
                const btn = document.getElementById('signup-btn');
                
                if (password !== confirmPassword) {
                    showMessage('Passwords do not match');
                    return;
                }
                
                setLoading(btn, true);
                
                const result = await Auth.signUpWithEmail(email, password);
                
                setLoading(btn, false);
                
                if (result.success) {
                    if (result.data.user && !result.data.session) {
                        showMessage('Please check your email to confirm your account.', 'success');
                    } else {
                        showMessage('Account created! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    }
                } else {
                    showMessage(result.error);
                }
            });

            // Forgot password form
            document.getElementById('forgot-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessage();
                
                const email = document.getElementById('forgot-email').value;
                const btn = document.getElementById('forgot-btn');
                
                setLoading(btn, true);
                
                const result = await Auth.resetPassword(email);
                
                setLoading(btn, false);
                
                if (result.success) {
                    showMessage('Password reset link sent! Check your email.', 'success');
                } else {
                    showMessage(result.error);
                }
            });

            // Google OAuth
            document.getElementById('google-btn').addEventListener('click', async () => {
                clearMessage();
                const result = await Auth.signInWithProvider('google');
                if (!result.success) {
                    showMessage(result.error);
                }
            });

            // GitHub OAuth
            document.getElementById('github-btn').addEventListener('click', async () => {
                clearMessage();
                const result = await Auth.signInWithProvider('github');
                if (!result.success) {
                    showMessage(result.error);
                }
            });

            // Check if already logged in
            Auth.init().then(() => {
                if (Auth.currentUser) {
                    window.location.href = 'index.html';
                }
            });
        });
    </script>
</body>

</html>
