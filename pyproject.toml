[project]
name = "a2z-dsa"
version = "1.0.0"
description = "A Data Structures and Algorithms learning platform with JSON-based content storage and static site generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dsa", "algorithms", "data-structures", "education"]

dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
    "types-beautifulsoup4>=4.11.0",
    "types-tqdm>=4.64.0",
]

[project.scripts]
a2z-render = "src.render_article:main"
a2z-download = "src.download_json:main"
a2z-localize = "src.localize_assets:main"
a2z-clean-trackers = "src.clean_trackers:main"
a2z-debitlify = "src.debitlify:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
